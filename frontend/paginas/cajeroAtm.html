<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cajero ATM | Simulador Bancario Web</title>
  <link rel="stylesheet" href="/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/estilos.css">
  <link rel="stylesheet" href="/css/cajeroAtm.css">
  <script src="/js/cajeroAtm.js" type="module"></script>
</head>
<body class="atm">
  <main class="container atm-contenedor py-4 py-lg-5">
    <header class="d-flex flex-wrap align-items-end justify-content-between gap-3 mb-4">
      <div>
        <p class="atm-secundario mb-1">Simulador Bancario Web</p>
        <h1 class="display-6 mb-0">Cajero ATM</h1>
      </div>
      <a class="link-light" href="/">Volver al inicio</a>
    </header>
    <p id="atm-aviso-general" role="status" class="atm-aviso mb-3" hidden></p>

    <section id="atm-ingreso" class="atm-panel atm-ingreso" aria-labelledby="atm-ingreso-titulo" hidden>
      <h2 id="atm-ingreso-titulo" class="h4 mb-3">Identifícate</h2>
      <form id="atm-formulario-ingreso" method="post">
        <div class="mb-3">
          <label for="atm-numero-cuenta" class="form-label">Número de cuenta</label>
          <input id="atm-numero-cuenta" name="numeroCuenta" class="form-control" inputmode="numeric" pattern="[0-9]{1,20}" maxlength="20" required>
        </div>
        <div class="mb-3">
          <label for="atm-pin" class="form-label">PIN de cuatro dígitos</label>
          <input id="atm-pin" name="pin" class="form-control" type="password" inputmode="numeric" autocomplete="off" pattern="[0-9]{4}" maxlength="4" required>
        </div>
        <button type="submit" class="btn btn-info fw-semibold">Entrar al cajero</button>
        <p id="atm-aviso-ingreso" class="atm-aviso mt-3 mb-0" role="alert" hidden></p>
      </form>
    </section>

    <div id="atm-operaciones" hidden>
      <div class="row g-4 mb-4">
        <div class="col-lg-5">
          <section class="atm-panel atm-saldo h-100" aria-labelledby="atm-saldo-titulo">
            <h2 id="atm-saldo-titulo" class="h4">Saldo disponible</h2>
            <p id="atm-saldo" class="atm-importe mb-2">—</p>
            <p class="atm-secundario">Cuenta <strong id="atm-cuenta-identificada"></strong></p>
            <button id="atm-salir" type="button" class="btn btn-outline-light">Finalizar y expulsar</button>
          </section>
        </div>

        <div class="col-lg-7">
          <section class="atm-panel h-100" aria-labelledby="atm-retiro-titulo">
            <h2 id="atm-retiro-titulo" class="h4 mb-3">Retirar efectivo</h2>
            <form id="atm-formulario-retiro" method="post">
              <fieldset class="mb-3">
                <legend class="form-label mb-2">Montos rápidos</legend>
                <div class="d-flex flex-wrap gap-2">
                  <button class="btn btn-outline-info" data-monto="20000.00" type="button">$ 20.000,00</button>
                  <button class="btn btn-outline-info" data-monto="50000.00" type="button">$ 50.000,00</button>
                  <button class="btn btn-outline-info" data-monto="100000.00" type="button">$ 100.000,00</button>
                </div>
              </fieldset>
              <label for="atm-monto-retiro" class="form-label">Monto (COP)</label>
              <div class="input-group mb-3">
                <span class="input-group-text" aria-hidden="true">$</span>
                <input id="atm-monto-retiro" class="form-control" name="monto" inputmode="decimal" maxlength="16" placeholder="0,00" required>
              </div>
              <button type="submit" class="btn btn-info fw-semibold">Confirmar retiro</button>
              <p id="atm-aviso-retiro" class="atm-aviso mt-3 mb-0" role="status" hidden></p>
            </form>
            <div id="atm-comprobante" class="atm-comprobante mt-3" tabindex="-1" hidden>
              <h3 class="h6 mb-2">Comprobante</h3>
              <p class="mb-1" id="atm-comprobante-importe"></p>
              <p class="mb-0 atm-secundario" id="atm-comprobante-saldo"></p>
            </div>
          </section>
        </div>
      </div>

      <section class="atm-panel" aria-labelledby="atm-movimientos-titulo">
        <h2 id="atm-movimientos-titulo" class="h4 mb-3">Últimos movimientos</h2>
        <p id="atm-aviso-movimientos" class="atm-aviso" role="status" hidden></p>
        <div class="table-responsive">
          <table class="table align-middle mb-0">
            <thead><tr><th scope="col">Fecha y hora</th><th scope="col">Tipo</th>
              <th scope="col">Monto</th><th scope="col">Saldo resultante</th></tr></thead>
            <tbody id="atm-filas-movimientos"></tbody>
          </table>
        </div>
      </section>
    </div>

    <noscript><p class="atm-aviso">Activa JavaScript para usar el cajero.</p></noscript>
  </main>
</body>
</html>
