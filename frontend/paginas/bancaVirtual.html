<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Banca virtual | Simulador Bancario Web</title>
  <link rel="stylesheet" href="/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/estilos.css">
  <script src="/js/sesion.js" defer></script>
</head>
<body>
  <main class="container py-5">
    <section class="card shadow-sm mx-auto panel-salud" aria-labelledby="titulo">
      <div class="card-body p-4 p-md-5">
        <h1 id="titulo" class="h2 mb-3">Banca virtual</h1>
        <p id="nombre-usuario" class="mb-4" hidden></p>
        <p id="aviso-sesion" role="alert" class="alert alert-danger" hidden></p>
        <button id="cerrar-sesion" type="button" class="btn btn-outline-primary">Cerrar sesión</button>
      </div>
    </section>
  </main>
</body>
</html>
