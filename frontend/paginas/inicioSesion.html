<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sesión | Simulador Bancario Web</title>
  <link rel="stylesheet" href="/css/bootstrap.min.css">
  <link rel="stylesheet" href="/css/estilos.css">
  <script src="/js/autenticacion.js" defer></script>
</head>
<body>
  <main class="container py-5">
    <section class="card shadow-sm mx-auto panel-salud" aria-labelledby="titulo">
      <div class="card-body p-4 p-md-5">
        <a href="/" class="d-inline-block mb-3">Simulador Bancario Web</a>
        <h1 id="titulo" class="h2 mb-4">Iniciar sesión</h1>
        <form id="formulario-acceso" action="/api/auth/login" method="post">
          <div class="mb-3">
            <label for="identificador" class="form-label">Correo o documento</label>
            <input id="identificador" name="identificador" class="form-control" autocomplete="username" maxlength="100" required>
          </div>
          <div class="mb-3">
            <label for="contrasena" class="form-label">Contraseña</label>
            <input type="password" id="contrasena" name="contrasena" class="form-control" autocomplete="current-password" maxlength="72" required>
          </div>
          <p id="error-acceso" role="alert" class="alert alert-danger" hidden></p>
          <button type="submit" class="btn btn-primary">Entrar</button>
        </form>
      </div>
    </section>
  </main>
</body>
</html>
